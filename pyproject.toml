[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentrace"
version = "0.1.0"
description = "Intent reconciliation for agentic coding"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[project.scripts]
intentrace = "intentrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intentrace"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "learning: tree-sitter API learning tests (deselect with '-m not learning')",
]
